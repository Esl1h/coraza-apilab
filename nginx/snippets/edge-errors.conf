# edge-errors.conf: JSON bodies for errors produced by nginx or Coraza.
#
# The API answers errors as {"error":{"code","message","request_id"}}.
# The edge uses the same envelope plus "source":"edge", so a client (or
# the test suite) can tell at a glance whether the request was stopped
# at the edge or reached the API.
#
# Responses proxied from the API are NOT rewritten
# (proxy_intercept_errors off): these pages only apply to statuses that
# nginx or Coraza produce themselves.

error_page 400 /_edge/400;
error_page 401 /_edge/401;
error_page 403 /_edge/403;
error_page 404 /_edge/404;
error_page 405 /_edge/405;
error_page 413 /_edge/413;
error_page 414 /_edge/414;
error_page 415 /_edge/415;
error_page 429 /_edge/429;
error_page 502 503 /_edge/502;
error_page 504 /_edge/504;

location ^~ /_edge/ {
    internal;
    # The original request was already inspected; the error page itself
    # must not be inspected again (or blocked again).
    coraza off;
    default_type application/json;

    location = /_edge/400 { return 400 '{"error":{"code":"bad_request","message":"request rejected at the edge","source":"edge","request_id":"$request_id"}}\n'; }
    location = /_edge/401 { return 401 '{"error":{"code":"unauthorized","message":"missing or malformed credentials","source":"edge","request_id":"$request_id"}}\n'; }
    location = /_edge/403 { return 403 '{"error":{"code":"waf_blocked","message":"request blocked by the WAF","source":"edge","request_id":"$request_id"}}\n'; }
    location = /_edge/404 { return 404 '{"error":{"code":"not_found","message":"no such route","source":"edge","request_id":"$request_id"}}\n'; }
    location = /_edge/405 { return 405 '{"error":{"code":"method_not_allowed","message":"method not allowed on this route","source":"edge","request_id":"$request_id"}}\n'; }
    location = /_edge/413 { return 413 '{"error":{"code":"payload_too_large","message":"request body too large","source":"edge","request_id":"$request_id"}}\n'; }
    location = /_edge/414 { return 414 '{"error":{"code":"uri_too_long","message":"request URI too long","source":"edge","request_id":"$request_id"}}\n'; }
    location = /_edge/415 { return 415 '{"error":{"code":"unsupported_media_type","message":"Content-Type not accepted on this route","source":"edge","request_id":"$request_id"}}\n'; }
    location = /_edge/429 {
        add_header Retry-After 1 always;
        add_header X-Request-ID $request_id always;
        return 429 '{"error":{"code":"rate_limited","message":"too many requests","source":"edge","request_id":"$request_id"}}\n';
    }
    location = /_edge/502 { return 502 '{"error":{"code":"upstream_unavailable","message":"the API is unavailable","source":"edge","request_id":"$request_id"}}\n'; }
    location = /_edge/504 { return 504 '{"error":{"code":"upstream_timeout","message":"the API did not answer in time","source":"edge","request_id":"$request_id"}}\n'; }
}
