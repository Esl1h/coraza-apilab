# proxy.conf: how nginx talks to the API (included by each location).

proxy_pass http://apilab;
proxy_http_version 1.1;
# Empty Connection header so upstream keepalive works.
proxy_set_header Connection "";

proxy_set_header Host $host;
# nginx's id replaces whatever the client sent: a client-chosen id would
# let an attacker forge log correlation.
proxy_set_header X-Request-ID $request_id;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

proxy_connect_timeout 3s;
proxy_send_timeout 15s;
proxy_read_timeout 15s;

# Backend errors (4xx/5xx with the API's JSON envelope) are passed
# through untouched; only errors produced at the edge are rewritten by
# edge-errors.conf.
proxy_intercept_errors off;

# Never leak backend implementation details.
proxy_hide_header X-Powered-By;
proxy_hide_header Server;
# The API echoes the X-Request-ID it received (ours); the server block
# adds it to every response, so drop the upstream copy to avoid a
# duplicated header.
proxy_hide_header X-Request-ID;
