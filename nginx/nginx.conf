# nginx.conf: reverse proxy in front of the API simulator, with the
# Coraza WAF module loaded.
#
# Request path through nginx (phases in order), and which control acts
# in each one:
#
#   accept / read headers   client_header_timeout, header buffer sizes
#   POST_READ               realip: rewrites the client address from
#                           X-Forwarded-For (only from trusted proxies)
#   REWRITE                 Coraza phase 1 (headers, URI, args, IP)
#   PREACCESS               limit_conn / limit_req (rate limiting), then
#                           Coraza phase 2 (request body)
#   CONTENT                 proxy_pass to the API
#   header/body filters     Coraza phases 3 and 4 (response)
#   LOG                     Coraza phase 5 + access log
#
# The WAF only ever sees requests nginx already accepted as valid HTTP:
# malformed request lines, oversized headers and slowloris-style slow
# clients are dropped by nginx itself, before Coraza.

load_module modules/ngx_http_coraza_module.so;

user nginx;
# Each worker loads its own copy of the WAF (a Go runtime plus the
# compiled CRS, tens of MiB). Size this to the CPUs you give the
# container, not to the host.
worker_processes 2;
pid /run/nginx.pid;

# The official image links these paths to the container's stdout/stderr.
error_log /var/log/nginx/error.log notice;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Do not advertise the nginx version (Server: nginx).
    server_tokens off;

    # One JSON line per request. request_id is the same value sent to
    # the API (X-Request-ID) and used as the Coraza transaction id, so a
    # single id links access log, WAF audit log and API log.
    log_format json escape=json
        '{"time":"$time_iso8601","request_id":"$request_id",'
        '"client":"$remote_addr","peer":"$realip_remote_addr",'
        '"method":"$request_method","uri":"$request_uri",'
        '"status":$status,"bytes":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_status":"$upstream_status",'
        '"upstream_time":"$upstream_response_time",'
        '"limit_req":"$limit_req_status",'
        '"user_agent":"$http_user_agent","test_case":"$http_x_test_case"}';
    access_log /var/log/nginx/access.log json;

    # -- Slow clients and buffers ------------------------------------
    # Short timeouts close slowloris/slow-POST connections early.
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 15s;
    keepalive_timeout 30s;
    keepalive_requests 1000;

    # Header limits: a request line or header above 8 KiB gets a 414/400
    # from nginx itself. The API refuses headers above 16 KiB, so the
    # backend never sees an oversized header.
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    # Outermost body limit (8 MiB). Coraza refuses above 2 MiB and the
    # API above 1 MiB; see coraza/coraza.conf for the three layers.
    client_max_body_size 8m;
    client_body_buffer_size 128k;

    # -- Real client IP ----------------------------------------------
    # Behind a load balancer, $remote_addr is the balancer. realip trusts
    # X-Forwarded-For ONLY when the TCP peer is in set_real_ip_from.
    #
    # LAB ONLY: the private ranges below include the Docker bridge, so
    # the test suite on the host can impersonate any client IP through
    # X-Forwarded-For (that is how the IP rules are exercised). In
    # production list only your balancer's addresses; trusting a range
    # your clients can reach lets anyone choose their own IP and walk
    # past every IP-based rule (allowlist, denylist, rate limit).
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # -- Rate limiting -----------------------------------------------
    # Coraza has no persistent collections (initcol is a no-op in v3),
    # so counting requests across transactions is nginx's job. Keys use
    # the real client IP (after realip).
    #
    # api   : general traffic, 20 r/s per IP with bursts of 40.
    # login : credential endpoint, 10 r/min per IP with a burst of 5:
    #         brute force and credential stuffing slow to a crawl.
    # conn  : concurrent connections per IP (protects /lab/slow).
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
    limit_conn_zone $binary_remote_addr zone=conn:10m;
    limit_req_status 429;
    limit_conn_status 429;
    limit_req_log_level warn;
    limit_conn_log_level warn;

    # -- Coraza ------------------------------------------------------
    # Enabled for every server/location unless a location says
    # `coraza off`. The rules are compiled inside each worker after
    # fork, so `nginx -t` does NOT validate them: a broken rule passes
    # the test and then kills every worker. coraza-check (run by
    # /docker-entrypoint.d/05-coraza-check.sh and `make check`) closes
    # that gap.
    coraza on;
    coraza_rules_file /etc/nginx/coraza/main.conf;
    coraza_transaction_id $request_id;

    include /etc/nginx/conf.d/*.conf;
}
