# 150-auth.conf: credentials in transit (IDs 10500-10599).
#
# The WAF does not authenticate anybody: the API does. What the edge can
# do is refuse malformed credentials early, keep secrets out of its own
# logs, and stop credential types the API never uses.

# 10500 | phase 1 | deny 401
# The API only uses Bearer tokens. Basic, Digest, NTLM or any other
# scheme is either a misconfigured client or someone testing whether a
# legacy auth path still exists behind the gateway.
SecRule REQUEST_HEADERS:Authorization "!@rx ^Bearer " \
    "id:10500,\
    phase:1,\
    deny,\
    status:401,\
    log,\
    t:none,\
    msg:'Authorization scheme other than Bearer',\
    logdata:'scheme=%{TX.lab_auth_scheme}',\
    tag:'lab/auth',\
    severity:'ERROR',\
    chain"
    SecRule REQUEST_HEADERS:Authorization "@rx ^(\S+)" \
        "t:none,\
        capture,\
        setvar:'tx.lab_auth_scheme=%{TX.1}'"

# 10510 | phase 1 | deny 401
# Bearer token format: the token alphabet of RFC 6750 and a sane length.
# Injection payloads, CRLF and 10 KiB tokens stop here. Note logdata
# prints only the token length: a WAF log is not a place for secrets.
SecRule REQUEST_HEADERS:Authorization "@beginsWith Bearer " \
    "id:10510,\
    phase:1,\
    deny,\
    status:401,\
    log,\
    t:none,\
    msg:'Malformed Bearer token',\
    logdata:'authorization_length=%{TX.lab_auth_length}',\
    tag:'lab/auth',\
    severity:'ERROR',\
    chain"
    SecRule REQUEST_HEADERS:Authorization "@unconditionalMatch" \
        "t:none,t:length,\
        setvar:'tx.lab_auth_length=%{MATCHED_VAR}',\
        chain"
        SecRule REQUEST_HEADERS:Authorization "!@rx ^Bearer [A-Za-z0-9._~+/-]{16,512}=*$" \
            "t:none"

# 10520 | phase 1 | deny 401
# Routes that always need a token. The API would answer 401 anyway; the
# edge answering first means unauthenticated floods never reach the
# backend. /lab/calls also accepts X-Lab-Token instead.
SecRule REQUEST_FILENAME "@rx ^/api/v1/auth/(?:me|logout)$" \
    "id:10520,\
    phase:1,\
    deny,\
    status:401,\
    log,\
    t:none,\
    msg:'Token-protected route called without Authorization',\
    tag:'lab/auth',\
    severity:'WARNING',\
    chain"
    SecRule &REQUEST_HEADERS:Authorization "@eq 0" \
        "t:none"

# 10530 | phase 1 | ctl:auditLogParts
# Keep passwords out of the WAF audit log: on the login route the
# request body (audit part C) is dropped from the audit record. The
# matched rules and the decision are still logged. Do the same for any
# route that receives secrets (password reset, token exchange).
SecRule REQUEST_FILENAME "@streq /api/v1/auth/login" \
    "id:10530,\
    phase:1,\
    pass,\
    nolog,\
    t:none,\
    tag:'lab/auth',\
    ctl:auditLogParts=-C"
