# 120-user-agent.conf: who claims to be talking (IDs 10200-10299).
#
# The User-Agent is attacker-controlled, so it is never a security
# boundary on its own. It is still a cheap, high-signal filter: lazy
# tools announce themselves, and real clients send headers that bare
# scripts do not. CRS 913100 already blocks well-known scanners (sqlmap,
# nikto, nuclei...); these rules add our own lists and a scoring
# example.

# 10200 | phase 1 | deny 403
# Attack tools missing from the CRS list (fuzzers, brute forcers,
# crawlers). @pmFromFile is an Aho-Corasick multi-pattern match:
# hundreds of entries cost about the same as one.
SecRule REQUEST_HEADERS:User-Agent "@pmFromFile ../data/bad-user-agents.txt" \
    "id:10200,\
    phase:1,\
    deny,\
    status:403,\
    log,\
    t:none,t:lowercase,\
    msg:'Attack tool User-Agent',\
    logdata:'user_agent=%{MATCHED_VAR}',\
    tag:'lab/user-agent',\
    tag:'attack-reputation-scanner',\
    severity:'CRITICAL'"

# 10210 | phase 1 | deny 403
# Default HTTP-library User-Agents are refused on the login route only.
# Credential stuffing kits rarely change it; real integrations call the
# API with a token, not with a password, and real users use a browser
# or the official client. Scoped to one route so automation elsewhere
# keeps working.
SecRule REQUEST_FILENAME "@streq /api/v1/auth/login" \
    "id:10210,\
    phase:1,\
    deny,\
    status:403,\
    log,\
    t:none,\
    msg:'HTTP library User-Agent on the login route',\
    logdata:'user_agent=%{REQUEST_HEADERS.User-Agent}',\
    tag:'lab/user-agent',\
    tag:'attack-automation',\
    severity:'ERROR',\
    chain"
    SecRule REQUEST_HEADERS:User-Agent "@pmFromFile ../data/automation-user-agents.txt" \
        "t:none,t:lowercase"

# Anomaly scoring example (10220 + 10230).
#
# Neither signal below is bad enough to block alone: some legitimate
# clients omit one header. Together they describe a bare script. Instead
# of `deny`, each rule ADDS POINTS to the same score CRS uses, and CRS
# rule 949110 blocks when the total reaches the threshold (5, see
# crs-setup.conf):
#
#   no User-Agent      +3 (warning)
#   no Accept          +2 (notice)
#   both               =5 -> blocked by CRS, not by these rules
#
# Why phase 2: CRS rule 901200 (phase 1) RESETS the scores to 0. A
# phase 1 rule loaded before CRS would add points that are then wiped.
# Phase 2 rules run after all phase 1 rules, so the points stick.
# (tx.warning_anomaly_score etc. are also set by CRS in phase 1.)

# 10220 | phase 2 | +3 inbound anomaly score
SecRule &REQUEST_HEADERS:User-Agent "@eq 0" \
    "id:10220,\
    phase:2,\
    pass,\
    log,\
    t:none,\
    msg:'Request without User-Agent',\
    tag:'lab/user-agent',\
    tag:'lab/scoring',\
    severity:'WARNING',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.warning_anomaly_score}'"

# 10230 | phase 2 | +2 inbound anomaly score
SecRule &REQUEST_HEADERS:Accept "@eq 0" \
    "id:10230,\
    phase:2,\
    pass,\
    log,\
    t:none,\
    msg:'Request without Accept header',\
    tag:'lab/user-agent',\
    tag:'lab/scoring',\
    severity:'NOTICE',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.notice_anomaly_score}'"
