# 110-protocol.conf: is this a sane HTTP request for THIS API
# (IDs 10100-10199).
#
# CRS REQUEST-920 already enforces generic HTTP protocol rules (methods,
# versions, Content-Type allowlist, argument limits, encodings). The
# rules here encode what only we know about our own deployment.

# 10100 | phase 1 | deny 400
# Host allowlist. Requests for a hostname we do not serve are either
# scanners hitting the IP directly or Host header attacks (cache
# poisoning, password-reset link poisoning, routing to an internal
# virtual host). The lab answers for localhost and api.lab.local, on
# any port (the examples publish 8080 and 8081 on the host).
SecRule REQUEST_HEADERS:Host "!@rx ^(?:localhost|127\.0\.0\.1|api\.lab\.local)(?::[0-9]{1,5})?$" \
    "id:10100,\
    phase:1,\
    deny,\
    status:400,\
    log,\
    t:none,t:lowercase,\
    msg:'Host header is not one of the hostnames this API serves',\
    logdata:'host=%{MATCHED_VAR}',\
    tag:'lab/protocol',\
    tag:'attack-protocol',\
    severity:'ERROR'"

# 10110 | phase 1 | deny 400
# Too many headers. Browsers and API clients send 10 to 20; hundreds of
# headers are a parser stress test or an attempt to push a payload out
# of a WAF's inspection window.
SecRule &REQUEST_HEADERS "@gt 40" \
    "id:10110,\
    phase:1,\
    deny,\
    status:400,\
    log,\
    t:none,\
    msg:'Too many request headers',\
    logdata:'count=%{MATCHED_VAR}',\
    tag:'lab/protocol',\
    severity:'ERROR'"

# 10120 | phase 1 | deny 400
# The same header twice where the API expects one. Duplicate
# Content-Type or Authorization headers are a request-smuggling and
# parser-confusion primitive: the WAF may inspect the first value while
# the backend uses the last.
SecRule &REQUEST_HEADERS:Content-Type|&REQUEST_HEADERS:Authorization|&REQUEST_HEADERS:Host "@gt 1" \
    "id:10120,\
    phase:1,\
    deny,\
    status:400,\
    log,\
    t:none,\
    msg:'Duplicated security-relevant header',\
    logdata:'%{MATCHED_VAR_NAME}=%{MATCHED_VAR}',\
    tag:'lab/protocol',\
    tag:'attack-protocol',\
    severity:'CRITICAL'"

# 10130 | phase 1 | deny 405
# Method per route. The API only accepts PUT, PATCH and DELETE on a
# single user and on the /lab/method utility. Everywhere else those
# methods are refused at the edge, before any handler code runs.
# (The global method allowlist is CRS 911100, set in crs-setup.conf.)
SecRule REQUEST_METHOD "@rx ^(?:PUT|PATCH|DELETE)$" \
    "id:10130,\
    phase:1,\
    deny,\
    status:405,\
    log,\
    t:none,\
    msg:'Method not allowed on this route',\
    logdata:'%{REQUEST_METHOD} %{REQUEST_FILENAME}',\
    tag:'lab/protocol',\
    severity:'WARNING',\
    chain"
    SecRule REQUEST_FILENAME "!@rx ^/(?:api/v1/users/[^/]+|lab/method)$" \
        "t:none"
