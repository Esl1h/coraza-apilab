# 160-payload.conf: what is inside the request (IDs 10600-10699).
#
# CRS already covers the generic injection classes (SQLi, XSS, RCE, LFI,
# RFI, SSRF to cloud metadata, prototype pollution, Log4Shell...). The
# rules here cover attacks specific to this API's features, which no
# generic rule set can know about.

# 10600 | phase 2 | deny 403
# GraphQL introspection. __schema/__type queries dump the whole API
# surface (types, fields, mutations) and are the first step of every
# GraphQL attack. Production GraphQL servers disable them; the edge
# enforces it even when someone forgets to. JSON args are flattened by
# the JSON body processor, so the query field is ARGS:json.query.
SecRule REQUEST_FILENAME "@streq /api/v1/graphql" \
    "id:10600,\
    phase:2,\
    deny,\
    status:403,\
    log,\
    t:none,\
    msg:'GraphQL introspection query',\
    logdata:'%{MATCHED_VAR_NAME}',\
    tag:'lab/payload',\
    tag:'attack-disclosure',\
    severity:'ERROR',\
    chain"
    SecRule ARGS:json.query "@rx \b__(?:schema|type)\b" \
        "t:none,t:removeWhitespace"

# 10610 | phase 2 | deny 403
# GraphQL resource exhaustion: aliases let one request run the same
# expensive field hundreds of times (alias:field). More than 20 aliases
# in one query is batching abuse, not a real client.
SecRule REQUEST_FILENAME "@streq /api/v1/graphql" \
    "id:10610,\
    phase:2,\
    deny,\
    status:403,\
    log,\
    t:none,\
    msg:'GraphQL alias batching (more than 20 aliases)',\
    tag:'lab/payload',\
    tag:'attack-dos',\
    severity:'ERROR',\
    chain"
    SecRule ARGS:json.query "@rx (?:\w+\s*:\s*\w+[^:]*){21}" \
        "t:none"

# 10620 | phase 2 | deny 403
# SSRF through URLs the API stores and later calls (webhook callback
# URLs, integration endpoints in /admin/config). CRS 934110 catches
# cloud metadata hosts; this rule refuses every internal destination:
# loopback, RFC 1918, link-local, IPv6 local and non-HTTP schemes.
SecRule REQUEST_FILENAME "@rx ^/(?:api/v1/webhooks/receive|admin/config)$" \
    "id:10620,\
    phase:2,\
    deny,\
    status:403,\
    log,\
    t:none,\
    msg:'URL pointing to an internal destination (SSRF)',\
    logdata:'%{MATCHED_VAR_NAME}=%{MATCHED_VAR}',\
    tag:'lab/payload',\
    tag:'attack-ssrf',\
    severity:'CRITICAL',\
    chain"
    SecRule ARGS "@rx (?i)^(?:(?:file|gopher|dict|ftp|ldap|jar)://|https?://(?:[^/@]*@)?(?:localhost|127\.|0\.0\.0\.0|10\.|172\.(?:1[6-9]|2[0-9]|3[01])\.|192\.168\.|169\.254\.|\[(?:::1|f[cd][0-9a-f]{2}:|fe80:)))" \
        "t:none,t:urlDecodeUni,t:trim"

# 10630 | phase 2 | deny 403
# Upload: executable and server-side script extensions are refused, for
# multipart (FILES holds the client-side file names) and for the raw
# octet-stream variant (?name=). The API never stores files, but a
# WAF rule must not depend on that.
SecRule FILES|ARGS_GET:name "@rx (?i)\.(?:php[0-9]?|phtml|phar|jsp|jspx|aspx?|ashx|cgi|pl|py|rb|sh|bash|exe|dll|so|bat|cmd|ps1|vbs|jar|war|svg)(?:\.|$)" \
    "id:10630,\
    phase:2,\
    deny,\
    status:403,\
    log,\
    t:none,t:trim,\
    msg:'Upload with a forbidden file extension',\
    logdata:'%{MATCHED_VAR_NAME}=%{MATCHED_VAR}',\
    tag:'lab/payload',\
    tag:'attack-file-upload',\
    severity:'CRITICAL',\
    chain"
    SecRule REQUEST_FILENAME "@streq /api/v1/files/upload" \
        "t:none"

# 10640 | phase 2 | deny 403
# Server-side template injection markers in free-text fields that end up
# rendered somewhere else (ticket title/description, feedback comment):
# {{7*7}}, ${7*7}, <%= 7*7 %>, #{7*7}. CRS only covers some engines at
# higher paranoia levels; for these fields there is no legitimate use.
SecRule REQUEST_FILENAME "@rx ^/api/v1/(?:tickets|forms/feedback)$" \
    "id:10640,\
    phase:2,\
    deny,\
    status:403,\
    log,\
    t:none,\
    msg:'Template injection syntax in a free-text field',\
    logdata:'%{MATCHED_VAR_NAME}=%{MATCHED_VAR}',\
    tag:'lab/payload',\
    tag:'attack-injection-generic',\
    severity:'CRITICAL',\
    chain"
    SecRule ARGS:json.title|ARGS:json.description|ARGS_POST:comment|ARGS_POST:name "@rx (?:\{\{.*\}\}|\$\{.*\}|<%.*%>|#\{.*\})" \
        "t:none,t:urlDecodeUni"

# 10650 | phase 2 | deny 403
# Privilege fields in the self-service config endpoint. The admin
# config echo must never be used to flip roles or feature flags that
# belong to a separate, audited workflow.
SecRule REQUEST_FILENAME "@streq /admin/config" \
    "id:10650,\
    phase:2,\
    deny,\
    status:403,\
    log,\
    t:none,\
    msg:'Privileged setting in /admin/config',\
    logdata:'%{MATCHED_VAR}',\
    tag:'lab/payload',\
    tag:'attack-privilege-escalation',\
    severity:'CRITICAL',\
    chain"
    SecRule ARGS_NAMES "@rx (?i)^json\.(?:role|is_admin|admin|superuser|permissions|debug|waf_enabled)$" \
        "t:none"
