# 100-edge-network.conf: who is talking to us (IDs 10000-10099).
#
# First stop of every request: decisions that depend only on the client
# address and the route, made before any content inspection. They are
# cheap (phase 1, no body), so they run first and short-circuit the
# expensive rules for traffic we already know what to do with.
#
# REMOTE_ADDR is the real client IP: nginx's realip module rewrites the
# connection address from X-Forwarded-For before Coraza runs (see
# nginx.conf, set_real_ip_from).
#
# Conventions used in every lab rule file:
#   - IDs 10000-19999 (1-99999 is reserved for local rules; CRS owns
#     900000-999999 and plugins 9500000-9999999).
#   - Every rule has msg, tag and severity, so the audit log explains
#     itself; the "lab/..." tags group them for filtering.
#   - `deny` = hard policy (blocks alone). Scoring rules (`pass` +
#     setvar on the anomaly score) live in 120-user-agent.conf.

# 10000 | phase 1 | deny 403
# Denylist: known bad sources (threat intel, previous incidents). The
# file is read once at startup; reload nginx to apply changes.
SecRule REMOTE_ADDR "@ipMatchFromFile ../data/ip-denylist.txt" \
    "id:10000,\
    phase:1,\
    deny,\
    status:403,\
    log,\
    t:none,\
    msg:'Client IP is in the denylist',\
    logdata:'client=%{REMOTE_ADDR}',\
    tag:'lab/edge',\
    tag:'lab/ip-reputation',\
    severity:'CRITICAL'"

# 10010 | phase 1 | ctl:ruleEngine=Off
# Health and readiness probes skip the WAF entirely: a probe blocked by
# a false positive takes a healthy instance out of the load balancer.
# The bypass is deliberately narrow (exact path, GET/HEAD, no query
# string) so it cannot be used to smuggle a payload past the WAF.
SecRule REQUEST_FILENAME "@rx ^/(?:health|ready)$" \
    "id:10010,\
    phase:1,\
    pass,\
    nolog,\
    t:none,\
    tag:'lab/edge',\
    chain"
    SecRule REQUEST_METHOD "@rx ^(?:GET|HEAD)$" \
        "t:none,\
        chain"
        SecRule QUERY_STRING "@rx ^$" \
            "t:none,\
            ctl:ruleEngine=Off"

# 10020 | phase 1 | deny 403
# Network ACL for administrative routes: they exist on the same API, but
# only the corporate network (VPN) may reach them. The application has
# its own authentication on some of them (/lab/calls needs a token);
# the ACL is defense in depth, a stolen token alone is not enough.
SecRule REQUEST_FILENAME "@rx ^/(?:admin|internal|metrics|lab/calls)(?:/|$)" \
    "id:10020,\
    phase:1,\
    deny,\
    status:403,\
    log,\
    t:none,t:lowercase,\
    msg:'Administrative route requested from outside the admin networks',\
    logdata:'client=%{REMOTE_ADDR} path=%{REQUEST_FILENAME}',\
    tag:'lab/edge',\
    tag:'lab/acl',\
    severity:'ERROR',\
    chain"
    SecRule REMOTE_ADDR "!@ipMatchFromFile ../data/admin-networks.txt" \
        "t:none"

# 10030 | phase 1 | ctl:ruleEngine=DetectionOnly
# Your own authorised scanner: every rule still runs and logs, nothing
# is blocked. A pentest gets real findings in the audit log instead of a
# wall of 403s, and nobody has to turn the WAF off for the engagement.
SecRule REMOTE_ADDR "@ipMatchFromFile ../data/trusted-scanners.txt" \
    "id:10030,\
    phase:1,\
    pass,\
    log,\
    t:none,\
    msg:'Trusted scanner: WAF in DetectionOnly for this request',\
    logdata:'client=%{REMOTE_ADDR}',\
    tag:'lab/edge',\
    severity:'NOTICE',\
    ctl:ruleEngine=DetectionOnly"
