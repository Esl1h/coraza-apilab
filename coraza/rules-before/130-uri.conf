# 130-uri.conf: what is being asked for (IDs 10300-10399).
#
# Positive security model applied to paths: instead of trying to
# enumerate every bad URL (impossible), describe the URLs the API has
# and refuse the rest. Scanners spend most of their requests on paths
# that do not exist (/wp-admin, /.env, /phpmyadmin); they die here,
# cheaply, before CRS and before the backend.

# 10300 | phase 1 | deny 414
# URI length cap. The longest legitimate URL of this API is a search
# with a 100-character query; 2 KiB leaves ample room. nginx also caps
# the request line (large_client_header_buffers), this is the
# application-aware limit.
SecRule REQUEST_URI_RAW "@gt 2048" \
    "id:10300,\
    phase:1,\
    deny,\
    status:414,\
    log,\
    t:none,t:length,\
    msg:'Request URI too long',\
    logdata:'length=%{MATCHED_VAR}',\
    tag:'lab/uri',\
    severity:'ERROR'"

# 10310 | phase 1 | deny 400
# Encoded path separators (%2f, %5c) and double encoding (%252e,
# %252f) in the PATH part of the raw URI (before "?"; in the query
# string they are legitimate). API paths never contain them; they exist
# to make the WAF and the backend decode the path differently (classic
# path traversal and ACL bypass technique).
SecRule REQUEST_URI_RAW "@rx (?i)^[^?]*%(?:2f|5c|25[0-9a-f]{2})" \
    "id:10310,\
    phase:1,\
    deny,\
    status:400,\
    log,\
    t:none,\
    msg:'Encoded path separator or double URL encoding',\
    logdata:'uri=%{REQUEST_URI_RAW}',\
    tag:'lab/uri',\
    tag:'attack-lfi',\
    severity:'CRITICAL'"

# 10320 | phase 1 | deny 404
# Sensitive file probes: VCS metadata, dotenv, backups, dumps, keys.
# Answered with 404, not 403: a 403 confirms "something is here and it
# is protected", a 404 gives the scanner nothing to follow up on.
# ctl:auditEngine=On: 404 is excluded from SecAuditLogRelevantStatus
# (API noise), so the WAF's own 404 decisions force their audit record.
SecRule REQUEST_FILENAME "@rx (?i)(?:/\.(?:git|svn|hg|env|aws|ssh|docker|kube|htaccess|htpasswd|ds_store)(?:/|$)|\.(?:bak|old|orig|swp|sql|sqlite|tar|tgz|gz|zip|7z|rar|pem|key|p12|pfx)$)" \
    "id:10320,\
    phase:1,\
    deny,\
    status:404,\
    log,\
    ctl:auditEngine=On,\
    t:none,t:urlDecodeUni,t:normalizePath,\
    msg:'Sensitive file probe',\
    logdata:'path=%{MATCHED_VAR}',\
    tag:'lab/uri',\
    tag:'attack-disclosure',\
    severity:'ERROR'"

# 10330 | phase 1 | deny 404
# Route inventory: only the top-level prefixes the API actually serves.
# This is the single most effective rule against blind scanning, and it
# doubles as API inventory documentation: a new route that is not added
# here is unreachable, which forces it to be declared.
SecRule REQUEST_FILENAME "!@rx ^/(?:$|health$|ready$|version$|metrics$|openapi\.json$|docs$|api/v1/|admin/|internal/|lab/|static/)" \
    "id:10330,\
    phase:1,\
    deny,\
    status:404,\
    log,\
    ctl:auditEngine=On,\
    t:none,\
    msg:'Route not in the API inventory',\
    logdata:'path=%{MATCHED_VAR}',\
    tag:'lab/uri',\
    tag:'lab/positive-model',\
    severity:'WARNING'"

# 10340 | phase 1 | deny 404
# Static files: an explicit allowlist of the four files the API embeds.
# No traversal payload, encoding trick or new file name can get through
# a list of exact names.
SecRule REQUEST_FILENAME "@beginsWith /static/" \
    "id:10340,\
    phase:1,\
    deny,\
    status:404,\
    log,\
    ctl:auditEngine=On,\
    t:none,\
    msg:'Static file not in the allowlist',\
    logdata:'path=%{REQUEST_FILENAME}',\
    tag:'lab/uri',\
    tag:'lab/positive-model',\
    severity:'WARNING',\
    chain"
    SecRule REQUEST_FILENAME "!@rx ^/static/(?:robots\.txt|style\.css|logo\.svg|data\.csv)$" \
        "t:none"
