# 190-runtime-exclusions.conf: request-dependent false-positive tuning
# (IDs 10900-10999).
#
# The last file before CRS. A ctl: action changes the engine for the
# CURRENT transaction only, so it must run before the CRS rule it
# targets (that is why this file is in rules-before/). Each exclusion is
# as narrow as possible: one route, one rule, one argument. Never
# "remove rule X everywhere" for a problem in one field.

# 10900 | phase 1 | ctl:ruleRemoveTargetById
# False positive found by tests/waf-test.sh (case body-1.5m-api):
# curl, and most HTTP clients, send "Expect: 100-continue" before a
# large body. CRS 920450 lists Expect as a restricted header (it is
# abused for request smuggling and to probe proxies) and the request
# was blocked (audit log: 920450 + 949111, score 5).
#
# The exclusion is scoped three ways: only the upload and webhook routes
# (the ones that take large bodies), only the exact value 100-continue,
# and only the Expect header for rule 920450. Any other Expect value,
# or Expect on any other route, is still blocked.
SecRule REQUEST_FILENAME "@rx ^/api/v1/(?:files/upload|webhooks/receive)$" \
    "id:10900,\
    phase:1,\
    pass,\
    nolog,\
    t:none,\
    tag:'lab/exclusion',\
    chain"
    SecRule REQUEST_HEADERS:Expect "@streq 100-continue" \
        "t:none,t:lowercase,\
        ctl:ruleRemoveTargetById=920450;REQUEST_HEADERS_NAMES:Expect"
