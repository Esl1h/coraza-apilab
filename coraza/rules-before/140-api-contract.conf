# 140-api-contract.conf: does the request match the API contract
# (IDs 10400-10499).
#
# The OpenAPI spec (/openapi.json) says what each route accepts. These
# rules enforce the security-relevant parts of it at the edge: path
# parameter formats, query parameter ranges, Content-Type per route and
# JSON body schemas. This is where a WAF stops being "generic attack
# signatures" and becomes a contract enforcer: anything outside the
# contract is refused, whether or not a signature exists for it.

# -- Path parameters with @restpath -----------------------------------
#
# @restpath (Coraza-specific operator) matches a path template and puts
# the placeholders in ARGS_PATH, so a path segment can be validated
# like any other argument. Each rule pair below: template match, then
# format check of the extracted value.

# 10400 | phase 1 | deny 400
# /api/v1/users/{id}: positive integer, at most 9 digits.
SecRule REQUEST_FILENAME "@restpath /api/v1/users/{id}" \
    "id:10400,\
    phase:1,\
    deny,\
    status:400,\
    log,\
    t:none,\
    msg:'Invalid user id in path',\
    logdata:'id=%{ARGS_PATH.id}',\
    tag:'lab/api-contract',\
    tag:'lab/positive-model',\
    severity:'ERROR',\
    chain"
    SecRule ARGS_PATH:id "!@rx ^[1-9][0-9]{0,8}$" \
        "t:none"

# 10401 | phase 1 | deny 400
# /api/v1/tickets/{id}: same format.
SecRule REQUEST_FILENAME "@restpath /api/v1/tickets/{id}" \
    "id:10401,\
    phase:1,\
    deny,\
    status:400,\
    log,\
    t:none,\
    msg:'Invalid ticket id in path',\
    logdata:'id=%{ARGS_PATH.id}',\
    tag:'lab/api-contract',\
    tag:'lab/positive-model',\
    severity:'ERROR',\
    chain"
    SecRule ARGS_PATH:id "!@rx ^[1-9][0-9]{0,8}$" \
        "t:none"

# 10402 | phase 1 | deny 400
# /api/v1/reports/{id}/download: report ids are rep-NNN.
SecRule REQUEST_FILENAME "@restpath /api/v1/reports/{id}/download" \
    "id:10402,\
    phase:1,\
    deny,\
    status:400,\
    log,\
    t:none,\
    msg:'Invalid report id in path',\
    logdata:'id=%{ARGS_PATH.id}',\
    tag:'lab/api-contract',\
    tag:'lab/positive-model',\
    severity:'ERROR',\
    chain"
    SecRule ARGS_PATH:id "!@rx ^rep-[0-9]{3}$" \
        "t:none"

# 10403 | phase 1 | deny 400
# /lab/status/{code}: a three-digit HTTP status.
SecRule REQUEST_FILENAME "@restpath /lab/status/{code}" \
    "id:10403,\
    phase:1,\
    deny,\
    status:400,\
    log,\
    t:none,\
    msg:'Invalid status code in path',\
    logdata:'code=%{ARGS_PATH.code}',\
    tag:'lab/api-contract',\
    tag:'lab/positive-model',\
    severity:'ERROR',\
    chain"
    SecRule ARGS_PATH:code "!@rx ^[1-5][0-9]{2}$" \
        "t:none"

# -- Query parameters --------------------------------------------------

# 10410 | phase 1 | deny 400
# /api/v1/search: q up to 100 characters (the backend accepts 256; the
# edge is stricter because nobody types a 256-character search, while
# fuzzers do).
SecRule REQUEST_FILENAME "@streq /api/v1/search" \
    "id:10410,\
    phase:1,\
    deny,\
    status:400,\
    log,\
    t:none,\
    msg:'Search query longer than 100 characters',\
    logdata:'length=%{MATCHED_VAR}',\
    tag:'lab/api-contract',\
    severity:'ERROR',\
    chain"
    SecRule ARGS_GET:q "@gt 100" \
        "t:none,t:length"

# 10411 | phase 1 | deny 400
# /api/v1/search: limit, when present, is an integer from 1 to 50.
SecRule REQUEST_FILENAME "@streq /api/v1/search" \
    "id:10411,\
    phase:1,\
    deny,\
    status:400,\
    log,\
    t:none,\
    msg:'Search limit is not an integer between 1 and 50',\
    logdata:'limit=%{ARGS_GET.limit}',\
    tag:'lab/api-contract',\
    severity:'ERROR',\
    chain"
    SecRule ARGS_GET:limit "!@rx ^(?:[1-9]|[1-4][0-9]|50)$" \
        "t:none"

# 10420 | phase 1 | deny 400
# /lab/slow?ms=: the backend accepts up to 10 s of sleep (MAX_SLOW_MS).
# Every slow request holds a connection and a worker slot, so a few
# hundred of them are a denial of service. Business-logic DoS is
# invisible to signatures; only a contract rule catches it. Cap: 2 s.
SecRule REQUEST_FILENAME "@streq /lab/slow" \
    "id:10420,\
    phase:1,\
    deny,\
    status:400,\
    log,\
    t:none,\
    msg:'Requested delay above the edge limit (2000 ms)',\
    logdata:'ms=%{ARGS_GET.ms}',\
    tag:'lab/api-contract',\
    tag:'attack-dos',\
    severity:'ERROR',\
    chain"
    SecRule ARGS_GET:ms "!@rx ^(?:[0-9]{1,3}|1[0-9]{3}|2000)$" \
        "t:none"

# 10421 | phase 1 | deny 400
# /lab/large?bytes=: same idea for response size (amplification: a
# tiny request asking for a 1 MiB answer). Cap: 256 KiB.
SecRule REQUEST_FILENAME "@streq /lab/large" \
    "id:10421,\
    phase:1,\
    deny,\
    status:400,\
    log,\
    t:none,\
    msg:'Requested response size above the edge limit (262144 bytes)',\
    logdata:'bytes=%{ARGS_GET.bytes}',\
    tag:'lab/api-contract',\
    tag:'attack-dos',\
    severity:'ERROR',\
    chain"
    SecRule ARGS_GET:bytes "!@rx ^[0-9]{1,6}$" \
        "t:none,\
        chain"
        SecRule ARGS_GET:bytes "@gt 262144" \
            "t:none"

# -- Content-Type per route --------------------------------------------
#
# CRS 920420 checks Content-Type against a global allowlist. Per route
# we know more: a JSON endpoint receiving a form or multipart body is
# either a broken client or someone probing a different body parser.

# 10430 | phase 1 | deny 415
SecRule REQUEST_METHOD "@rx ^(?:POST|PUT|PATCH)$" \
    "id:10430,\
    phase:1,\
    deny,\
    status:415,\
    log,\
    t:none,\
    msg:'JSON route called without application/json',\
    logdata:'content_type=%{REQUEST_HEADERS.Content-Type}',\
    tag:'lab/api-contract',\
    severity:'ERROR',\
    chain"
    SecRule REQUEST_FILENAME "@rx ^/(?:api/v1/(?:auth/login|users(?:/[0-9]+)?|reports/export|tickets|graphql)|admin/config)$" \
        "t:none,\
        chain"
        SecRule REQUEST_HEADERS:Content-Type "!@rx ^application/json(?:\s*;\s*charset=utf-8)?$" \
            "t:none,t:lowercase"

# 10431 | phase 1 | deny 415
SecRule REQUEST_FILENAME "@streq /api/v1/forms/feedback" \
    "id:10431,\
    phase:1,\
    deny,\
    status:415,\
    log,\
    t:none,\
    msg:'Form route called without application/x-www-form-urlencoded',\
    logdata:'content_type=%{REQUEST_HEADERS.Content-Type}',\
    tag:'lab/api-contract',\
    severity:'ERROR',\
    chain"
    SecRule REQUEST_HEADERS:Content-Type "!@rx ^application/x-www-form-urlencoded(?:\s*;\s*charset=utf-8)?$" \
        "t:none,t:lowercase"

# 10432 | phase 1 | deny 415
SecRule REQUEST_FILENAME "@streq /api/v1/files/upload" \
    "id:10432,\
    phase:1,\
    deny,\
    status:415,\
    log,\
    t:none,\
    msg:'Upload route called without multipart/form-data or application/octet-stream',\
    logdata:'content_type=%{REQUEST_HEADERS.Content-Type}',\
    tag:'lab/api-contract',\
    severity:'ERROR',\
    chain"
    SecRule REQUEST_HEADERS:Content-Type "!@rx ^(?:multipart/form-data;\s*boundary=|application/octet-stream$)" \
        "t:none,t:lowercase"

# -- JSON body schemas with @validateSchema ----------------------------
#
# @validateSchema (Coraza-specific operator) validates the parsed JSON
# body against a JSON Schema. The schemas set additionalProperties:false,
# which is the edge defense against mass assignment (OWASP API3:2023,
# Broken Object Property Level Authorization): a client sending
# {"name":"x","is_admin":true} is refused before the backend has a
# chance to bind an unexpected field.
#
# Phase 2 (the body is only available after phase 1). Schema paths are
# relative to the root filesystem, so they are absolute here.

# 10440 | phase 2 | deny 400
SecRule REQUEST_FILENAME "@streq /api/v1/users" \
    "id:10440,\
    phase:2,\
    deny,\
    status:400,\
    log,\
    t:none,\
    msg:'User body does not match the schema',\
    tag:'lab/api-contract',\
    tag:'lab/positive-model',\
    severity:'ERROR',\
    chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,\
        chain"
        SecRule REQUEST_BODY "@validateSchema /etc/nginx/coraza/schemas/user-create.json" \
            "t:none"

# 10441 | phase 2 | deny 400
SecRule REQUEST_FILENAME "@streq /api/v1/tickets" \
    "id:10441,\
    phase:2,\
    deny,\
    status:400,\
    log,\
    t:none,\
    msg:'Ticket body does not match the schema',\
    tag:'lab/api-contract',\
    tag:'lab/positive-model',\
    severity:'ERROR',\
    chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,\
        chain"
        SecRule REQUEST_BODY "@validateSchema /etc/nginx/coraza/schemas/ticket-create.json" \
            "t:none"

# 10442 | phase 2 | deny 400
SecRule REQUEST_FILENAME "@streq /api/v1/auth/login" \
    "id:10442,\
    phase:2,\
    deny,\
    status:400,\
    log,\
    t:none,\
    msg:'Login body does not match the schema',\
    tag:'lab/api-contract',\
    tag:'lab/positive-model',\
    severity:'ERROR',\
    chain"
    SecRule REQUEST_BODY "@validateSchema /etc/nginx/coraza/schemas/login.json" \
        "t:none"
