# 900-config-exclusions.conf: configure-time changes to rules loaded
# earlier (IDs 19000-19099 for any helper rules).
#
# SecRuleRemoveById / SecRuleUpdateTargetById / SecRuleUpdateActionById
# act on rules that ALREADY EXIST when the directive is parsed, so this
# file must be loaded after CRS and the plugins (step 8 of main.conf).
# They apply to every request. For exclusions that depend on the
# request (route, parameter), use ctl: actions in
# rules-before/190-runtime-exclusions.conf instead.

# Coraza crash workaround (referer-hardening plugin).
#
# Rule 9524139 clears capture variables with setvar:'!tx.1'. In Coraza
# v3.8.1 a setvar without "=value" dereferences a nil macro
# (internal/actions/setvar.go, setvarFn.Evaluate) and the Go panic
# aborts the nginx worker: every request carrying a Referer header
# killed a worker. The rule only resets TX.1-TX.4 before 9524140
# captures them again, so removing it is safe. Delete this line once
# Coraza handles variable removal in setvar.
SecRuleRemoveById 9524139
