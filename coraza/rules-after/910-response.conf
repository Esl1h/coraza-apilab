# 910-response.conf: what the API sends back (IDs 19100-19199).
#
# Phases 3 (response headers) and 4 (response body). The request was
# already allowed and the backend already did its work: these rules
# are about not LEAKING things, and about observability.
#
# Phase 4 can still replace the response because coraza-nginx holds the
# response headers until the body is inspected
# (coraza_delay_response_headers on, the default) for the MIME types
# in SecResponseBodyMimeType.

# 19100 | phase 4 | deny 403
# Data loss prevention with a canary. The simulator returns the fixed
# marker LAB_RESPONSE_MARKER_7f3a on /lab/response-marker; think of it
# as a canary row planted in the production database. If it ever shows
# up in a response, something is dumping data it should not.
SecRule RESPONSE_BODY "@contains LAB_RESPONSE_MARKER_7f3a" \
    "id:19100,\
    phase:4,\
    deny,\
    status:403,\
    log,\
    t:none,\
    msg:'Canary marker in the response body (data leak)',\
    tag:'lab/response',\
    tag:'attack-disclosure',\
    severity:'CRITICAL'"

# 19110 | phase 3 | log only
# The same canary in a response HEADER is only logged. This shows the
# detection-only pattern (`pass,log`): useful while you measure a new
# rule's false positives before switching it to `deny`.
SecRule RESPONSE_HEADERS "@contains LAB_RESPONSE_MARKER_7f3a" \
    "id:19110,\
    phase:3,\
    pass,\
    log,\
    t:none,\
    msg:'Canary marker in a response header',\
    logdata:'%{MATCHED_VAR_NAME}',\
    tag:'lab/response',\
    tag:'attack-disclosure',\
    severity:'WARNING'"

# 19120 | phase 4 | deny 403
# Secrets in responses: private keys and cloud access keys must never
# leave the API, whatever the endpoint. /lab/echo reflects the query
# string, so the lab test plants a fake AWS key id there.
SecRule RESPONSE_BODY "@rx (?:-----BEGIN (?:RSA |EC |OPENSSH |ENCRYPTED )?PRIVATE KEY-----|\b(?:AKIA|ASIA)[0-9A-Z]{16}\b)" \
    "id:19120,\
    phase:4,\
    deny,\
    status:403,\
    log,\
    t:none,\
    msg:'Secret material in the response body',\
    tag:'lab/response',\
    tag:'attack-disclosure',\
    severity:'CRITICAL'"

# 19130 | phase 3 | log only
# Backend 5xx: not an attack, but a burst of them during a scan often
# means the scanner found an input the code does not handle. Logged
# (audit log) for the SRE side; nothing is blocked.
SecRule RESPONSE_STATUS "@rx ^5[0-9]{2}$" \
    "id:19130,\
    phase:3,\
    pass,\
    log,\
    t:none,\
    msg:'Backend answered with a server error',\
    logdata:'status=%{RESPONSE_STATUS} path=%{REQUEST_FILENAME}',\
    tag:'lab/response',\
    tag:'lab/observability',\
    severity:'NOTICE'"

# 19140 | phase 3 | log only
# Content-Type drift: every /api/v1 response is JSON except the CSV
# report download. HTML or text from an API route means an error page
# from some framework or proxy leaked through.
SecRule REQUEST_FILENAME "@beginsWith /api/v1/" \
    "id:19140,\
    phase:3,\
    pass,\
    log,\
    t:none,\
    msg:'Unexpected Content-Type on an API response',\
    logdata:'content_type=%{RESPONSE_HEADERS.Content-Type}',\
    tag:'lab/response',\
    tag:'lab/observability',\
    severity:'NOTICE',\
    chain"
    SecRule RESPONSE_HEADERS:Content-Type "!@rx ^(?:application/json|text/csv)" \
        "t:none,t:lowercase,\
        chain"
        SecRule RESPONSE_STATUS "!@streq 204" \
            "t:none"
