# main.conf: the single entry point loaded by nginx
# (`coraza_rules_file /etc/nginx/coraza/main.conf;`).
#
# ORDER MATTERS. Coraza runs rules phase by phase (1 request headers,
# 2 request body, 3 response headers, 4 response body, 5 logging) and,
# inside each phase, in the order they were loaded here. The sequence
# below is the one documented by the CRS project:
#
#   1. engine          how to inspect (body access, limits, audit log)
#   2. crs-setup       CRS knobs (paranoia, thresholds, allowed methods)
#   3. plugins config  plugin knobs
#   4. plugins before  plugin rules that must run before CRS
#   5. rules-before    lab rules: edge policy, positive model and
#                      runtime exclusions (ctl:) that must exist before
#                      the CRS rule they change runs
#   6. CRS             the generic attack detection + scoring + blocking
#   7. plugins after   plugin rules that need CRS results
#   8. rules-after     config-time exclusions (SecRuleUpdateTargetById,
#                      SecRuleRemoveById act on rules already loaded,
#                      so they MUST come after CRS) and response rules
#
# Include paths are ABSOLUTE on purpose: a relative glob such as
# `Include crs/rules/*.conf` silently matched nothing (19 rules loaded
# instead of ~700, no error). Data files used by @pmFromFile and
# @ipMatchFromFile are relative and resolve from the rule file's own
# directory, which does work.

# 1
Include /etc/nginx/coraza/coraza.conf
# 2
Include /etc/nginx/coraza/crs-setup.conf
# 3 + 4
Include /etc/nginx/coraza/plugins/*-config.conf
Include /etc/nginx/coraza/plugins/*-before.conf
# 5
Include /etc/nginx/coraza/rules-before/*.conf
# 6
Include /etc/nginx/coraza/crs/rules/*.conf
# 7
Include /etc/nginx/coraza/plugins/*-after.conf
# 8
Include /etc/nginx/coraza/rules-after/*.conf
