# coraza.conf: engine settings (step 1 of main.conf).
#
# Based on coraza.conf-recommended from corazawaf/coraza v3, with every
# deviation explained. This file decides HOW the engine inspects
# traffic; WHAT it looks for lives in crs-setup.conf, the CRS and the
# lab rules.

# -- Rule engine ------------------------------------------------------
#
# On             : rules can block (disruptive actions are executed).
# DetectionOnly  : rules run and log, nothing is blocked. This is how a
#                  WAF is rolled out in production: run DetectionOnly,
#                  read the audit log, tune exclusions, then switch On.
# Off            : the engine does nothing.
#
# The lab ships On so the tests can prove what is blocked. Override per
# request with ctl:ruleEngine=DetectionOnly (see rules-before/100-*).
SecRuleEngine On

# Regex pre-filter: a Coraza optimisation that skips the full regex
# when a literal required by the pattern is absent. Kept Off like the
# upstream recommendation; turn it on only after benchmarking.
SecRxPreFilter Off

# -- Request body -----------------------------------------------------

# Without body access, phase 2 sees nothing: SQLi in a JSON POST would
# pass untouched. Always On for an API.
SecRequestBodyAccess On

# Pick the right parser by Content-Type so ARGS gets populated with the
# individual fields (json.user.name, ...). Without this an API body is
# just an opaque string and most CRS rules miss it.
SecRule REQUEST_HEADERS:Content-Type "^(?:application(?:/soap\+|/)|text/)xml" \
    "id:200000,phase:1,t:none,t:lowercase,pass,nolog,ctl:requestBodyProcessor=XML"

SecRule REQUEST_HEADERS:Content-Type "^application/json" \
    "id:200001,phase:1,t:none,t:lowercase,pass,nolog,ctl:requestBodyProcessor=JSON"

SecRule REQUEST_HEADERS:Content-Type "^application/[a-z0-9.-]+[+]json" \
    "id:200006,phase:1,t:none,t:lowercase,pass,nolog,ctl:requestBodyProcessor=JSON"

# Lab addition. Binary uploads and plain-text webhooks have no
# structure. Without this rule, CRS 901340 forces body inspection and
# Coraza falls back to the URLENCODED parser for unknown types: random
# bytes become thousands of garbage "arguments" (a 1 MiB upload hit
# SecArgumentsLimit, and parsing cost about 10 s per MiB). RAW keeps
# the body as a single REQUEST_BODY value that CRS still inspects.
SecRule REQUEST_HEADERS:Content-Type "^(?:application/octet-stream|text/plain)" \
    "id:200007,phase:1,t:none,t:lowercase,pass,nolog,ctl:requestBodyProcessor=RAW"

# A URI the engine cannot parse is refused outright (400): ambiguous
# parsing between WAF and backend is the root of many bypasses.
SecRule URI_PARSE_ERROR "@eq 1" \
    "id:200009,phase:1,t:none,log,deny,status:400,msg:'URI failed to parse'"

# Deeply nested JSON is a CPU/stack DoS vector. The simulator never
# needs more than a few levels; 1024 upstream, 32 here.
SecRequestBodyJsonDepthLimit 32

# Each argument costs inspection time. The CRS also caps this
# (tx.max_num_args), but the engine limit protects the parser itself.
SecArgumentsLimit 500

# Body size limits. Defense in depth, three layers, each one smaller
# than the previous so you can tell from the response who answered:
#   nginx client_max_body_size      8 MiB  -> nginx 413
#   SecRequestBodyLimit             2 MiB  -> Coraza 413 (this file)
#   backend MAX_BODY_BYTES          1 MiB  -> API 413 (JSON envelope)
SecRequestBodyLimit 2097152
# Bodies above this are buffered to disk (SecTmpDir) instead of RAM.
SecRequestBodyInMemoryLimit 131072
# Reject  : anything over the limit is refused (413). Safe default.
# ProcessPartial: inspect only the first N bytes and let the rest pass,
#           which is an evasion path (put the payload after N bytes).
SecRequestBodyLimitAction Reject

# A body the parser failed to read (broken JSON, bad multipart) is not
# inspected, so it must not be forwarded either.
SecRule REQBODY_ERROR "!@eq 0" \
    "id:200002,phase:2,t:none,log,deny,status:400,\
    msg:'Failed to parse request body',\
    logdata:'%{reqbody_error_msg}',severity:2"

# Strict multipart: duplicate part headers and quoting tricks are
# classic WAF bypass techniques (the backend and the WAF disagree on
# where a part ends).
SecRule MULTIPART_STRICT_ERROR "!@eq 0" \
    "id:200003,phase:2,t:none,log,deny,status:400,\
    msg:'Multipart request body failed strict validation',\
    logdata:'MULTIPART_DUPLICATE_PART_HEADER=%{MULTIPART_DUPLICATE_PART_HEADER}, MULTIPART_INVALID_QUOTING=%{MULTIPART_INVALID_QUOTING}'"

SecRule ARGUMENTS_LIMIT_REACHED "@eq 1" \
    "id:200004,phase:1,t:none,log,deny,status:400,\
    msg:'Argument limit reached (GET/path args)'"

SecRule ARGUMENTS_LIMIT_REACHED "@eq 1" \
    "id:200005,phase:2,t:none,log,deny,status:400,\
    msg:'Argument limit reached (POST args)'"

# -- Response body ----------------------------------------------------

# Needed for data-leak detection (CRS RESPONSE-95x and the lab DLP rule
# in rules-after/). It costs latency: coraza-nginx holds the response
# headers until the body is inspected (coraza_delay_response_headers).
SecResponseBodyAccess On

# Only inspect types where leaks are readable. Binary downloads and
# CSV exports stream untouched.
SecResponseBodyMimeType text/plain text/html text/xml application/json

SecResponseBodyJsonDepthLimit 1024

# Responses above 512 KiB are inspected partially and still delivered.
# Reject here would break legitimate large responses (/lab/large).
SecResponseBodyLimit 524288
SecResponseBodyLimitAction ProcessPartial

# -- Filesystem -------------------------------------------------------

# Writable by the nginx worker user (created in the Dockerfile).
SecDataDir /var/cache/coraza
SecTmpDir /var/cache/coraza

# -- Audit log --------------------------------------------------------
#
# The audit log is the WAF's evidence: one JSON document per relevant
# transaction with the request, the matched rules and the decision.
#
# RelevantOnly + RelevantStatus: log transactions that matched a rule
# with `log`/`auditlog`, or whose status is 4xx/5xx (except 404, which
# is noise in an API). Go's RE2 has no lookahead, so "everything but
# 404" is spelled out.
SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^(?:5[0-9]{2}|40[0-35-9]|4[1-9][0-9])$"

# Parts: A header, B request headers, C request body, F response
# headers, H matched rules / decision, K matched rules list, Z end.
# E (response body) is left out on purpose: it would copy whatever the
# API returned (possibly the very data we want to stop leaking).
SecAuditLogParts ABCFHKZ

SecAuditLogType Serial
SecAuditLogFormat JSON
# A file (not stdout) so the access log stays one line per request;
# `make audit` tails it.
SecAuditLog /var/log/coraza/audit.log
SecAuditLogFileMode 0644
SecAuditLogDirMode 0755

# Debug log: 0 (off) in normal use. Raise to 9 to see every rule,
# variable and transformation while writing a new rule.
SecDebugLog /var/log/coraza/debug.log
SecDebugLogLevel 0

# -- Identification ---------------------------------------------------

# Hides the engine name/version from error pages and headers. Not a
# control by itself, but it gives a scanner one less fingerprint.
SecComponentSignature "lab-waf"
