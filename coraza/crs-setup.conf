# crs-setup.conf: OWASP CRS tuning (step 2 of main.conf).
#
# Replaces crs-setup.conf.example from CRS v4. Only the knobs the lab
# changes are here; anything not set falls back to the CRS default
# defined in REQUEST-901-INITIALIZATION.conf.
#
# How CRS decides (anomaly scoring mode):
#   1. Each attack rule that matches does NOT block. It adds points to
#      tx.inbound_anomaly_score_plN (critical=5, error=4, warning=3,
#      notice=2).
#   2. REQUEST-949 sums the points and blocks (403) when the total
#      reaches tx.inbound_anomaly_score_threshold.
#   3. RESPONSE-959 does the same for responses (outbound threshold).
# One strong signal (a critical SQLi) blocks alone; several weak
# signals add up. This is what makes CRS tunable without editing rules.

# Default disruptive behaviour for rules that say `block`: log and keep
# going (the score decides). Never put `deny` here, it would turn every
# single CRS match into a block and destroy the scoring model.
SecDefaultAction "phase:1,log,auditlog,pass"
SecDefaultAction "phase:2,log,auditlog,pass"

# -- Paranoia levels --------------------------------------------------
#
# PL1: few false positives, catches the obvious (default).
# PL2: more rules (e.g. SQL keywords in odd places), some tuning needed.
# PL3/PL4: high-security apps with a dedicated tuning effort.
#
# Split setup: BLOCK at PL1 but DETECT (log only) up to PL2. The PL2
# matches show up in the audit log with their score, so you can see
# what raising the level would catch before you pay for its false
# positives. This is the CRS-recommended way to climb levels.
SecAction \
    "id:900000,phase:1,pass,t:none,nolog,\
    setvar:tx.blocking_paranoia_level=1"

SecAction \
    "id:900001,phase:1,pass,t:none,nolog,\
    setvar:tx.detection_paranoia_level=2"

# -- Anomaly thresholds -----------------------------------------------
#
# 5 = one critical rule blocks. Higher numbers are a rollout aid (start
# at 100 to observe, lower step by step), not a steady state.
SecAction \
    "id:900110,phase:1,pass,t:none,nolog,\
    setvar:tx.inbound_anomaly_score_threshold=5,\
    setvar:tx.outbound_anomaly_score_threshold=4"

# Early blocking: evaluate the score at the end of phase 1 (headers)
# too, so a request already over the threshold is refused before
# nginx even reads its body. Saves bandwidth and CPU on obvious attacks.
SecAction \
    "id:900120,phase:1,pass,t:none,nolog,\
    setvar:tx.early_blocking=1"

# -- HTTP policy ------------------------------------------------------

# Methods the API really uses (rule 911100). TRACE, CONNECT, PROPFIND
# and friends are refused before reaching the backend.
SecAction \
    "id:900200,phase:1,pass,t:none,nolog,\
    setvar:'tx.allowed_methods=GET HEAD POST PUT PATCH DELETE OPTIONS'"

# Accepted request Content-Types (rule 920420). The format is
# |type| with pipes, compared after lowercasing and dropping params.
# application/octet-stream is needed by /api/v1/files/upload and
# text/plain by /api/v1/webhooks/receive.
SecAction \
    "id:900220,phase:1,pass,t:none,nolog,\
    setvar:'tx.allowed_request_content_type=|application/json| |application/x-www-form-urlencoded| |multipart/form-data| |application/octet-stream| |text/plain|'"

# Charset allowlist for the Content-Type header (rule 920480).
SecAction \
    "id:900280,phase:1,pass,t:none,nolog,\
    setvar:'tx.allowed_request_content_type_charset=|utf-8|'"

# HTTP/1.0 is refused: no Host header requirement and no keep-alive,
# typical of scripts and old scanners. nginx talks HTTP/1.1 and HTTP/2.
SecAction \
    "id:900230,phase:1,pass,t:none,nolog,\
    setvar:'tx.allowed_http_versions=HTTP/1.1 HTTP/2 HTTP/2.0'"

# -- Argument limits (rules 920300-920390) -----------------------------
#
# Sized to the API contract (largest field: ticket description, 2000
# chars; graphql query, 2048 chars). Limits are cheap and stop entire
# classes of fuzzing and buffer abuse.
SecAction \
    "id:900300,phase:1,pass,t:none,nolog,\
    setvar:tx.max_num_args=64,\
    setvar:tx.arg_name_length=64,\
    setvar:tx.arg_length=4096,\
    setvar:tx.total_arg_length=65536"

# Upload limits (rules 920400/920410): one file up to 1 MiB, the
# backend MAX_BODY_BYTES.
SecAction \
    "id:900350,phase:1,pass,t:none,nolog,\
    setvar:tx.max_file_size=1048576,\
    setvar:tx.combined_file_sizes=1048576"

# -- Version marker (required by CRS 901001) ---------------------------
SecAction \
    "id:900990,phase:1,pass,t:none,nolog,\
    tag:'OWASP_CRS',\
    ver:'OWASP_CRS/4.25.2',\
    setvar:tx.crs_setup_version=4252"
